plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id("de.mannodermaus.android-junit5") version "1.10.0.0"

}

android {
    namespace 'com.dd.personalwallet'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('signing/debug/keystore.jks')
            storePassword '01678195241'
            keyAlias 'careplus2025'
            keyPassword '01678195241'
        }
    }

    defaultConfig {
        applicationId "com.dd.personalwallet"
        minSdk 33
        targetSdk 34
        versionCode 3
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        debug {
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }


    dataBinding {
        enabled true
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }

    }
}

dependencies {

    implementation project(":personalwallet-core")

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.2'
    implementation 'androidx.test.ext:junit-ktx:1.2.1'
    kapt 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    kapt 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.8.1'

    implementation "com.google.dagger:hilt-android:2.44"
    kapt "androidx.hilt:hilt-compiler:1.2.0"
    kapt "com.google.dagger:hilt-compiler:2.44"

//    //Jetpack Compose
//
//    implementation("androidx.compose.ui:ui:1.7.8")
//    implementation("androidx.compose.material:material-android:1.7.8")
//    implementation("androidx.compose.ui:ui-tooling-preview-android:1.7.8")
//    debugImplementation("androidx.compose.ui:ui-tooling-android:1.7.8")
//
//    //Viewmodel support
//    implementation("androidx.lifecycle:lifecycle-viewmodel-compose-android:2.8.7")
//
//    //Navigation compose
//
//    implementation("androidx.navigation:navigation-compose:2.8.7")
//
//    //material 3

//    implementation("androidx.compose.material3:material3:1.3.1")

    // android test library

    testImplementation 'junit:junit:4.13.2'
    testImplementation "androidx.test:core:1.6.1"
    testImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'androidx.test:rules:1.6.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

    // Mockito core
    testImplementation 'org.mockito:mockito-core:4.5.1'

    // Mockito Kotlin
    testImplementation 'org.mockito.kotlin:mockito-kotlin:4.0.0'

    // Mockito Android
    androidTestImplementation 'org.mockito:mockito-android:4.5.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'junit:junit:4.13.2'


    testImplementation 'com.google.dagger:hilt-android-testing:2.44'
    kaptTest 'com.google.dagger:hilt-android-compiler:2.44'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.44'
    kaptAndroidTest 'com.google.dagger:hilt-android-compiler:2.44'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    //material
    implementation 'com.google.android.material:material:1.12.0'

    //glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'


