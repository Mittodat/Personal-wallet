plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id("de.mannodermaus.android-junit5") version "1.10.0.0"
    id 'com.google.gms.google-services'

}

android {
    namespace 'com.dd.personalwallet'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('signing/debug/keystore.jks')
            storePassword '01678195241'
            keyAlias 'careplus2025'
            keyPassword '01678195241'
        }

        release {
            def keystoreFile = null
            def keyStorePassword = '', alias = '', password = ''

            def propsFile = file('signing.properties')
            if (propsFile.exists()) {
                keystoreFile = file('keystore.jks')
                if (keystoreFile.exists()) {
                    def props = new Properties()
                    props.load(new FileInputStream(propsFile))

                    keyStorePassword = props['storePassword']
                    alias = props['keyAlias']
                    password = props['keyPassword']
                } else {
                    println "app/keystore.jks file missing"
                }
            } else
                println "app/signing.properties file missing"

            storeFile = keystoreFile
            storePassword = keyStorePassword
            keyAlias = alias
            keyPassword = password
        }
    }

    defaultConfig {
        applicationId "com.dd.personalwallet"
        minSdk 33
        targetSdk 34
        versionCode 6
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        debug {
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable false
            minifyEnabled false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources false

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }


    dataBinding {
        enabled true
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }

    }
}

dependencies {

    implementation project(":personalwallet-core")

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.2'
    implementation 'androidx.test.ext:junit-ktx:1.2.1'
    kapt 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    kapt 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.8.1'

    implementation "com.google.dagger:hilt-android:2.44"
    kapt "androidx.hilt:hilt-compiler:1.2.0"
    kapt "com.google.dagger:hilt-compiler:2.44"

    //google service
